[project]
name = "lawai-ai"
version = "0.1.0"
description = "LawAI intelligence service: parsing, chunking, embeddings, hybrid retrieval, agent, review, drafting and research."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "groq>=0.13",
  "pypdf>=5.0",
  "mammoth>=1.8",
  "boto3>=1.35",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
